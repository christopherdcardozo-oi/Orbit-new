           fill="none" stroke="#c084fc" stroke-opacity="0.25" stroke-width="46"/>

  <!-- Orbit ring -->
  <ellipse cx="512" cy="512" rx="320" ry="160" transform="rotate(-20 512 512)"
           fill="none" stroke="#c084fc" stroke-opacity="0.9" stroke-width="16"/>

  <!-- Planet -->
  <circle cx="512" cy="512" r="210" fill="url(#planetGrad)"/>

  <!-- Moon glow -->
  <circle cx="832" cy="392" r="62" fill="#f5f3ff" fill-opacity="0.3"/>

  <!-- Moon -->
